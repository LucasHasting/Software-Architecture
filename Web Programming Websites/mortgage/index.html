<!doctype html>
<html lang="en">
<head>
    <title>Mortgage Payment Calculator</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" async></script>
</head>
<body>
    <h3>Mortgage Payment Calculator</h3>
    <div>
        <form onreset="reset_rate();" onsubmit="return false;">
            <label for="price">Price (of a house):</label>
            <input type="number" id="price" name="quantity" min="1" max="1000000000000000" step="1" value="1000000" required><br>

            <label for="down">Down Payment: </label>
            <input type="number" id="down" name="down" min="1" max="1000000000000000" step="1" value="1000" required><br>

            <label for="term">Term: </label>
            <select id="term" name="term">
                <option value="15">15 Years</option>
                <option value="20">20 Years</option>
                <option value="25">25 Years</option>
                <option value="30">30 Years</option>
            </select><br>

            <label for="rate">Interest Rate: </label>
            <input type="range" min="1.00" max="15.00" id="rate" name="rate" step="0.05" value="1.00" onChange="rate_change();"> <span id="rate_num"> 1.00% </span>
            <br><br>

            <button type="submit" class="submit" onClick="result();">Calculate Result</button>
            <button type="reset" onChange="rate_change();">Clear</button>
        </form>

        <br>

        <div id="ans"></div>
    </div>
